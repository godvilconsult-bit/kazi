# OPTIONAL offline fallback. Normal dev uses the Railway `development` environment (see .env / docs/02 §7).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kazi
      POSTGRES_PASSWORD: kazi
      POSTGRES_DB: kazi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazi -d kazi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
